name: Benchmark Gecko (Windows)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark Gecko (Windows)
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep
        run: cargo install ripgrep --locked

      - name: Build release
        run: cargo build --release

      - name: Run benchmark
        shell: pwsh
        run: |
          .\scripts\benchmark.ps1 -QueriesFile scripts\benchmark-queries-gecko.json -SkipBuild -BenchDir $env:RUNNER_TEMP\tgrep-bench -ResultsPath benchmark-results.md

      - name: Print results
        shell: pwsh
        run: Get-Content benchmark-results.md

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-gecko-windows
          path: benchmark-results.md
