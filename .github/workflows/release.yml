name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows builds are handled by the ADO OneBranch sign-and-release pipeline
          # which produces signed binaries. See .github/workflows/sign-and-release.yml.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install musl-tools (x86_64-linux-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (aarch64-linux-musl)
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release binary
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked -p tgrep-cli --bin tgrep --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --locked -p tgrep-cli --bin tgrep --target ${{ matrix.target }}

      - name: Package (unix)
        run: |
          staging=$(mktemp -d)
          cp target/${{ matrix.target }}/release/tgrep "$staging/"
          cp README.md "$staging/"
          tar czf tgrep-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C "$staging" .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tgrep-${{ matrix.target }}
          path: tgrep-${{ github.ref_name }}-*

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum tgrep-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            tgrep-*
            checksums.txt
