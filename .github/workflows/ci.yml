name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Weekly release qualification, native filesystems on all OSes
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy
      - run: cargo clippy --locked --workspace --all-targets --features tgrep-cli/managed-test-hooks -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: bash scripts/test-install.sh
      - name: Test qualification runner
        run: python -B -m unittest discover -s scripts/qualification -p 'test_*.py' -v
      - name: Test standalone scripts
        # Python 3.14 exits 5 for an empty inventory; never mask real test failures.
        if: hashFiles('scripts/test_*.py') != ''
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check locked dependency graphs and all four fuzz targets
        if: runner.os == 'Linux'
        run: python -B scripts/qualification/qualify.py dependencies
      - name: Test vendored ignore, including doctests (separate workspace)
        run: cargo test --manifest-path vendor/ignore/Cargo.toml --locked
      - run: cargo build --locked --workspace --verbose
      - name: Test agent integrations
        if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s scripts/agent -p 'test_*.py' -v
      - run: cargo build --locked --workspace --benches --verbose
      - name: Build pinned legacy CLI and core reader controls
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 1120aca41dd192ae61bdd996e9886cb354a78a27
          git archive --format=zip --output="$RUNNER_TEMP/tgrep-legacy.zip" 1120aca41dd192ae61bdd996e9886cb354a78a27
          python -B scripts/qualification/prepare_legacy.py "$RUNNER_TEMP/tgrep-legacy.zip" "$RUNNER_TEMP/tgrep-legacy-source"
          cargo build --locked --manifest-path "$RUNNER_TEMP/tgrep-legacy-source/Cargo.toml" -p tgrep-cli --target-dir "$RUNNER_TEMP/tgrep-legacy-target"
          cargo build --locked --manifest-path "$RUNNER_TEMP/tgrep-legacy-source/Cargo.toml" -p tgrep-core --example legacy_reader --target-dir "$RUNNER_TEMP/tgrep-legacy-target"
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          echo "TGREP_V1_BINARY=$RUNNER_TEMP/tgrep-legacy-target/debug/tgrep$suffix" >> "$GITHUB_ENV"
          echo "TGREP_V1_READER=$RUNNER_TEMP/tgrep-legacy-target/debug/examples/legacy_reader$suffix" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace --features tgrep-cli/managed-test-hooks --verbose -- --test-threads=2
      - name: Qualify private checkout installation
        # Pay for one release build on PRs/pushes; cover all OSes weekly/manually.
        if: runner.os == 'Linux' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -B scripts/qualification/qualify.py installed
      - name: Verify all lockfiles stayed unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock vendor/ignore/Cargo.lock

  managed-measurement:
    name: Managed lifecycle measurements (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release measurement before timing
        run: cargo test --locked --release -p tgrep-cli --features managed-test-hooks --test shared_daemon --no-run
      - name: Measure bounded native lifecycle without injected pauses
        env:
          TGREP_MANAGED_PERFORMANCE_REPORT: ${{ runner.temp }}/managed-native.json
        run: cargo test --locked --release -p tgrep-cli --features managed-test-hooks --test shared_daemon managed::performance::native_managed_lifecycle_measurement -- --ignored --exact --test-threads=1 --nocapture
      - name: Preserve native measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/managed-native.json
          if-no-files-found: error
      - name: Verify measurement did not change lockfiles
        if: always()
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock vendor/ignore/Cargo.lock
