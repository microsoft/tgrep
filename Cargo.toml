[workspace]
members = ["tgrep-core", "tgrep-cli"]
exclude = ["vendor/ignore"]
resolver = "2"

[workspace.package]
version = "1.2.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/microsoft/tgrep"
authors = ["Shengyu Fu"]

[workspace.dependencies]
tgrep-core = { path = "tgrep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
rusqlite = { git = "https://github.com/rusqlite/rusqlite.git", rev = "a1a23ea2a6a8a27bc07c8b10cbd363760287e1cc", features = ["bundled"] }
